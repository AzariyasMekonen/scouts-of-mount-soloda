name: "Scouts of Mount Soloda"
author: "AdwaCTF"
category: osint
description: |-
  Yekatit 1888 (March 1, 1896). The heights of Adwa are shrouded in mist.
  Emperor Menelik II and Empress Taytu relied on local peasant scouts
  stationed on the highest basalt peak overlooking the battlefield.
  
  An intercepted reconnaissance report from Ras Alula's lookouts has fallen
  into our hands. Analyze the geographic landmarks, coordinate reports, and
  historical scout cipher key to decrypt the runner's wire and recover the flag.
  
  Flag format: `AdwaCTF{...}`
